{{- if and .Values.operator.configurations.snapshotPublicNamespace .Values.operator.configurations.snapshotPublisherGroup }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  # The public catalog namespace is shared by every release deployed on the cluster, such as the
  # per-PR stagings: prefixing the release keeps each binding owned by exactly one of them.
  name: {{ include "crownlabs.fullname" . }}-publish-instance-snapshots
  namespace: {{ .Values.operator.configurations.snapshotPublicNamespace }}
  labels:
    {{- include "crownlabs.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: crownlabs-publish-instance-snapshots
subjects:
  - kind: Group
    name: {{ .Values.operator.configurations.snapshotPublisherGroup | quote }}
    apiGroup: rbac.authorization.k8s.io
{{- end }}
